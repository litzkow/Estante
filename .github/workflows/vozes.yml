name: Baixar as vozes para dentro do app
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/vozes.yml']
permissions:
  contents: write
jobs:
  vozes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Baixar o que ainda falta
        run: |
          set -e
          HF=https://huggingface.co
          get() { [ -s "$1" ] || { mkdir -p "$(dirname "$1")"; curl -fsSL -o "$1" "$2"; }; }
          K=vozes/kokoro
          for f in config.json tokenizer.json tokenizer_config.json onnx/model_quantized.onnx; do get $K/$f "$HF/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/$f"; done
          for v in af_heart af_bella af_nicole am_michael am_fenrir am_puck bf_emma bm_george bm_fable; do get $K/voices/$v.bin "$HF/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/$v.bin"; done
          mkdir -p /tmp/n && cd /tmp/n && npm init -y >/dev/null && npm i --no-audit --no-fund @diffusionstudio/piper-wasm@1.0.0 >/dev/null
          cd $GITHUB_WORKSPACE
          mkdir -p vozes/lib/phonemize
          ls -la /tmp/n/node_modules/@diffusionstudio/piper-wasm/build/ > vozes/lib/phonemize/LISTA.txt
          cp /tmp/n/node_modules/@diffusionstudio/piper-wasm/build/piper_phonemize.* vozes/lib/phonemize/
          du -ah vozes/lib/phonemize
      - name: Guardar no repositório
        run: |
          git config user.name "estante-bot"; git config user.email "estante-bot@users.noreply.github.com"
          git add vozes
          git commit -m "Vozes guardadas dentro do app" || exit 0
          git push
