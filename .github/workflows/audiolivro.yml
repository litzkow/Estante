name: Narrar audiolivro
on:
  workflow_dispatch:
    inputs:
      livro: { description: 'Nome do livro (arquivo em audio-src, sem .json)', required: true }
      voz: { description: 'Voz (af_heart, bm_george, pf_dora, pm_alex...)', required: true }
permissions:
  contents: write
jobs:
  narrar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { parte: [0, 1, 2, 3, 4, 5, 6, 7] }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "audio-src\nfonte/audio", sparse-checkout-cone-mode: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with: { path: modelos, key: kokoro-onnx-v1.0 }
      - name: Preparar a voz
        run: |
          pip install -q kokoro-onnx lameenc numpy
          sudo apt-get install -y -qq espeak-ng >/dev/null || true
          mkdir -p modelos
          [ -s modelos/kokoro-v1.0.onnx ] || curl -fsSL -o modelos/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -s modelos/voices-v1.0.bin ] || curl -fsSL -o modelos/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Narrar
        env: { KOKORO_MODEL: modelos/kokoro-v1.0.onnx, KOKORO_VOICES: modelos/voices-v1.0.bin }
        run: python fonte/audio/gerar.py "audio-src/${{ inputs.livro }}.json" saida "${{ inputs.voz }}" ${{ matrix.parte }} 8
      - uses: actions/upload-artifact@v4
        with: { name: "parte-${{ matrix.parte }}", path: saida, if-no-files-found: ignore }
  juntar:
    needs: narrar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "audio", sparse-checkout-cone-mode: false }
      - uses: actions/download-artifact@v4
        with: { pattern: "parte-*", merge-multiple: true, path: "audio/${{ inputs.livro }}/${{ inputs.voz }}" }
      - name: Guardar
        run: |
          git config user.name "estante-bot"; git config user.email "estante-bot@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 - <<'PY'
          import json, os, glob
          idx = {}
          for d in sorted(glob.glob('audio/*/*/')):
              livro, voz = d.rstrip('/').split('/')[-2:]
              caps = sorted(int(os.path.basename(f)[:3]) for f in glob.glob(d + '*.mp3'))
              if caps: idx.setdefault(livro, {'voices': {}})['voices'][voz] = {'chapters': caps}
          json.dump(idx, open('audio/index.json', 'w'), ensure_ascii=False, indent=1)
          PY
            git add audio && git commit -qm "Audiolivro: ${{ inputs.livro }} (${{ inputs.voz }})" && git push -q && break
            sleep $((RANDOM % 10 + 3))
          done
          du -sh audio/${{ inputs.livro }}/${{ inputs.voz }}
