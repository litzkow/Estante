/* ---------- free books bundled with the site: added to the shelf automatically ---------- */
const Starter = {
  base: /github\.io$/.test(location.hostname) ? 'livros/' : 'https://litzkow.github.io/Estante/livros/',
  async run() {
    let cat;
    try { cat = await (await fetch(this.base + 'catalogo.json', { cache: 'no-cache' })).json(); } catch (e) { return; }
    await this.tag(cat);
    const got = new Set(S.starterGot || []);
    const todo = cat.filter(x => !got.has(x.file));
    if (!todo.length) return;
    const ban = el('div', { class: 'banner dl' }, icon('download'), el('div', { class: 'dlt' }, el('div', { class: 'dlm' }), el('div', { class: 'hbar' }, el('i'))));
    $('#l-banner').append(ban);
    const total = todo.reduce((a, x) => a + x.size, 0); let done = 0, k = 0;
    const upd = name => { ban.querySelector('.dlm').textContent = t('dlBooks').replace('{n}', ++k).replace('{t}', todo.length) + ' · ' + name; ban.querySelector('i').style.width = Math.round(done / total * 100) + '%'; };
    const batch = [];
    const flush = async () => { if (batch.length) { await importFiles(batch.splice(0)); setS('starterGot', [...got]); } };
    for (const x of todo) {
      upd(x.title);
      try {
        const r = await fetch(this.base + encodeURIComponent(x.file));
        if (!r.ok) throw new Error(r.status);
        const reader = r.body.getReader(); const parts = [];
        for (; ;) { const { done: d, value } = await reader.read(); if (d) break; parts.push(value); done += value.length; ban.querySelector('i').style.width = Math.round(done / total * 100) + '%'; }
        batch.push(new File(parts, x.file)); got.add(x.file);
        if (x.big) await flush();
      } catch (e) { console.warn('starter', x.file, e); }
    }
    await flush();
    ban.remove();
    await this.tag(cat);
  },
  async tag(cat) {
    let ch = false;
    for (const b of await DB.all('books')) {
      const x = cat.find(x => x.file === b.fname);
      if (!x) continue;
      if (x.work && (b.work !== x.work || b.lang !== x.lang)) { b.work = x.work; b.lang = x.lang; await DB.put('books', b.id, b); ch = true; }
      if (x.series && (b.series !== x.series || b.snum !== x.num)) { b.series = x.series; b.snum = x.num; await DB.put('books', b.id, b); ch = true; }
      if (x.cover && b.cv !== x.cv) {
        try { const r = await fetch(this.base + x.cover); const bl = r.ok ? await r.blob() : null; if (bl && bl.size > 2000) { b.cover = new Blob([bl], { type: 'image/jpeg' }); b.cv = x.cv; await DB.put('books', b.id, b); ch = true; } } catch (e) { }
      }
    }
    if (ch) Lib.render();
  },
};

/* a PDF that holds several books (a "complete collection") becomes one shelf folder with each book in order.
   The file is stored once; each book only points to its range of pages. */
async function splitCollections() {
  let changed = false;
  for (const b of await DB.all('books')) {
    if (b.format !== 'pdf' || b.splitChecked || b.fileOf || b.kind === 'comic') continue;
    b.splitChecked = true;
    const blob = await DB.get('files', b.id);
    if (!blob) { await DB.put('books', b.id, b); continue; }
    let pdf;
    try {
      pdf = await openPdf(blob);
      const n = pdf.numPages, tops = [];
      for (const it of (await pdf.getOutline()) || []) {
        let p = null;
        try { let d = it.dest; if (typeof d === 'string') d = await pdf.getDestination(d); if (Array.isArray(d) && d[0]) p = (await pdf.getPageIndex(d[0])) + 1; } catch (e) { }
        if (p) tops.push({ label: (it.title || '').trim(), page: p, kids: (it.items || []).length });
      }
      tops.sort((a, c) => a.page - c.page);
      const vols = [];
      tops.forEach((x, k) => { if (x.kids >= 5) { const nx = tops.slice(k + 1).find(y => y.page > x.page); vols.push({ ...x, to: nx ? nx.page - 1 : n }); } });
      if (vols.length >= 2 && vols.every(v => v.to - v.page >= 30)) {
        // series name: what the volume titles have in common ("Harry Potter and the …" → "Harry Potter")
        let pre = vols[0].label; for (const v of vols) { let i = 0; while (i < pre.length && i < v.label.length && pre[i].toLowerCase() === v.label[i].toLowerCase()) i++; pre = pre.slice(0, i); }
        pre = pre.replace(/\b(and|e|the|o|a|of|de|do|da)\s*$/i, '').replace(/\b(and|e|the|o|a|of|de|do|da)\s*$/i, '').replace(/[\s:,–—-]+$/, '').trim();
        const series = pre.length >= 4 ? pre : b.title;
        // which language is this collection in (to pair it with the same books in the other language)
        let lang = b.lang || '';
        try { let tx = ''; for (const pg of [vols[0].page + 8, vols[0].page + 12, vols[0].page + 20]) { if (pg > n) continue; const tc = await (await pdf.getPage(pg)).getTextContent(); tx += ' ' + tc.items.map(i => i.str).join(' '); } lang = detectLang(tx) || lang; } catch (e) { }
        for (let k = 0; k < vols.length; k++) {
          const v = vols[k]; let cover = null;
          try { cover = await bestCover(pdf, v.page, v.to); } catch (e) { }
          const id = b.id + '-v' + (k + 1);
          await DB.put('books', id, { id, kind: 'book', format: 'pdf', title: v.label, author: b.author || '', fname: b.fname, fileOf: b.id, range: { from: v.page, to: v.to }, series, snum: k + 1, cover, pages: v.to - v.page + 1, size: 0, added: b.added || Date.now(), opened: 0, updated: 0, pct: 0, pos: null, bookmarks: [], highlights: [], collections: [], prefs: {}, fp: (b.fp || b.id) + ':v' + (k + 1), lang, work: 'serie:' + seriesKey(series) + '#' + (k + 1) });
        }
        b.hidden = true; changed = true;
      }
      await DB.put('books', b.id, b);
    } catch (e) { console.warn('split', e); await DB.put('books', b.id, b).catch(() => { }); }
    finally { closePdf(pdf); }
  }
  if (changed) { await Lib.render(); toast(t('splitDone')); }
}

// cut the white page margin around a cover picture
function trimWhite(cv) {
  const W = cv.width, H = cv.height, d = cv.getContext('2d').getImageData(0, 0, W, H).data;
  const ink = (x, y) => { const i = (y * W + x) * 4; return d[i] + d[i + 1] + d[i + 2] < 705; };
  const rowInk = y => { let c = 0; for (let x = 0; x < W; x += 2) if (ink(x, y)) c++; return c > W * 0.04; };
  const colInk = x => { let c = 0; for (let y = 0; y < H; y += 2) if (ink(x, y)) c++; return c > H * 0.04; };
  let t = 0, b = H - 1, l = 0, r = W - 1;
  while (t < H / 3 && !rowInk(t)) t++; while (b > H * 2 / 3 && !rowInk(b)) b--;
  while (l < W / 3 && !colInk(l)) l++; while (r > W * 2 / 3 && !colInk(r)) r--;
  const w = r - l + 1, h = b - t + 1;
  if (w > W * 0.95 && h > H * 0.95) return cv;
  if (w < W * 0.4 || h < H * 0.4 || h / w < 1.1 || h / w > 1.8) return cv;
  const o = document.createElement('canvas'); o.width = w; o.height = h; o.getContext('2d').drawImage(cv, l, t, w, h, 0, 0, w, h); return o;
}

// a volume's own cover is usually one of its first pages: take the most "inked" one (a full-page picture beats a white title page)
async function bestCover(pdf, from, to) {
  let best = null, bestInk = -1;
  for (let pg = from; pg <= Math.min(to || from + 3, from + 3, pdf.numPages); pg++) {
    const cv = await renderPdfPage(pdf, pg, 360), d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
    let ink = 0; for (let i = 0; i < d.length; i += 64) if (d[i] + d[i + 1] + d[i + 2] < 690) ink++;
    if (ink > bestInk) { bestInk = ink; best = cv; }
  }
  return best ? canvasBlob(trimWhite(best), 'image/jpeg', 0.85) : null;
}

// once: volumes of a collection get the same work tag (so the two languages show as one book) and their real cover
async function fixVolumes() {
  const all = await DB.all('books'), vols = all.filter(b => b.fileOf && b.series && b.snum);
  if (!vols.length) return;
  const groups = new Map();
  for (const b of vols) { const k = seriesKey(b.series) + '#' + b.snum; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(b); }
  let changed = false;
  for (const [k, g] of groups) {
    const langs = g.map(b => b.lang).filter(Boolean);
    for (const b of g) {
      let ch = false;
      if (!b.work) { b.work = 'serie:' + k; ch = true; }
      if (!b.lang && g.length === 2) { const other = langs[0]; if (other) { b.lang = other === 'pt' ? 'en' : 'pt'; ch = true; } }
      if (ch) { await DB.put('books', b.id, b); changed = true; }
    }
  }
  if (!S.volCoverFix) {
    setS('volCoverFix', true);
    const byFile = new Map(); for (const b of vols) { if (!byFile.has(b.fileOf)) byFile.set(b.fileOf, []); byFile.get(b.fileOf).push(b); }
    for (const [fid, g] of byFile) {
      const f = await DB.get('files', fid); if (!f) continue;
      let pdf; try { pdf = await openPdf(f); } catch (e) { continue; }
      try { for (const b of g) { try { const c = await bestCover(pdf, b.range.from, b.range.to); if (c) { const r = await DB.get('books', b.id); r.cover = c; await DB.put('books', b.id, r); changed = true; } } catch (e) { } } }
      finally { closePdf(pdf); }
    }
  }
  if (changed) { Lib.books = (await DB.all('books')).filter(b => !b.hidden); await Lib.render(); }
}

/* ================= family library: a private GitHub repository shared by the household =================

const Family = {
  get on() { return !!(S.famRepo && S.famToken); },

    let n = 0;

  async ready(kind, voice) { try { return !(await this.missing(kind, voice)).length; } catch (e) { return false; } },
  // download what is missing, reporting 0–100

    if (!miss.length) return true;

    for (const f of miss) { let n = 0; try { const h = await fetch(b + f, { method: 'HEAD', cache: 'no-store' }); n = +h.headers.get('content-length') || 0; } catch (e) { } sizes.push(n || 1e6); total += n || 1e6; }

    return true;
  },
  async remove() { try { await caches.delete(VOZ_CACHE); } catch (e) { } },
};

// the code that runs inside the worker (kept as a function, started from a Blob)
function vozWorkerMain() {
  let B = '', CN = '', kok = null, ort = null, phonMod = null;
  const sess = {}, cfgs = {};
  const KOK = 'https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/';
  const nf = self.fetch.bind(self);
  // files come from the phone first, the site second
  async function cfetch(u, o) {

    if (s.startsWith(KOK)) s = B + 'kokoro/' + s.slice(KOK.length);
    if (s.startsWith(B)) { try { const c = await caches.open(CN), r = await c.match(s); if (r) return r; } catch (e) { } return nf(s); }

      kok = await m.KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX', { dtype: 'q8', device: 'wasm' });

    if (!phonMod) phonMod = (await modFrom('lib/vits/piper-DeOu3H9E.js')).createPiperPhonemize;
    if (!phonBin) phonBin = await (await cfetch(B + 'lib/phonemize/piper_phonemize.wasm')).arrayBuffer();
    if (!phonData) phonData = await (await cfetch(B + 'lib/phonemize/piper_phonemize.data')).arrayBuffer();
    // one pronunciation engine, reused for every passage
    if (!phonInst) phonInst = await phonMod({
      print: l => { const f = phonOut; phonOut = null; if (!f) return; try { f.res(JSON.parse(l).phoneme_ids); } catch (e) { f.rej(e); } },
      printErr: l => { if (phonOut && /error/i.test(l)) { const f = phonOut; phonOut = null; f.rej(new Error(l)); } },
      wasmBinary: phonBin, noInitialRun: true,
      getPreloadedPackage: () => phonData.slice(0),
      locateFile: f => B + 'lib/phonemize/' + f.split('/').pop(),
    });

      phonOut = { res, rej };

      catch (e) { phonInst = null; phonOut = null; rej(e); }

    });
  }
  async function piper(text, voice) {
    if (!ort) {
      ort = await modFrom('lib/ort/ort.wasm.min.mjs');
      ort.env.wasm.wasmPaths = B + 'lib/ort/'; ort.env.wasm.numThreads = 1;

      input: new ort.Tensor('int64', BigInt64Array.from(ids.map(BigInt)), [1, ids.length]),
      input_lengths: new ort.Tensor('int64', BigInt64Array.from([BigInt(ids.length)]), [1]),
      scales: new ort.Tensor('float32', Float32Array.from([inf.noise_scale ?? 0.667, inf.length_scale ?? 1, inf.noise_w ?? 0.8]), [3]),
    };
    if (cfg.num_speakers > 1) feeds.sid = new ort.Tensor('int64', BigInt64Array.from([0n]), [1]);

    const m = e.data;

    } catch (err) { self.postMessage({ id: m.id, err: String(err && err.message || err) }); }
  };
}

const VozWorker = {

    try { const r = await fetch(this.base() + 'index.json', { cache: 'no-cache' }); if (r.ok) for (const [k, v] of Object.entries(await r.json())) idx[k] = Object.assign(v, { src: 'pub' }); } catch (e) { }
    if (Family.on) { try { const r = await Family.api(Family.repo() + '/contents/audio/index.json', { raw: true, ok404: true }); if (r.ok) for (const [k, v] of Object.entries(await r.json())) idx[k] = Object.assign(v, { src: 'priv' }); } catch (e) { } }
    if (Object.keys(idx).length) { this.idx = idx; this.idxAt = Date.now(); DB.put('kv', 'ab:index', idx).catch(() => { }); }
    else this.idx = (await DB.get('kv', 'ab:index').catch(() => null)) || {};
    return this.idx;
  },
  // narrated voices ready for this book
  async voices(rec) {
    const e = (await this.index())[this.key(rec)]; if (!e) return [];
    // the most natural (Google) first
    return Object.keys(e.voices || {}).map(v => { const x = abVoice(v); return { id: 'a:' + v, name: x[0], g: x[1], lang: x[2], hd: !!x[3], chapters: e.voices[v].chapters || [] }; }).sort((a, b) => b.hd - a.hd);
  },
  async has(rec, voice, ch) { return (await this.voices(rec)).some(v => v.id === voice && v.chapters.includes(ch)); },
  async src(rec) { const e = (await this.index())[this.key(rec)]; return e ? e.src : 'pub'; },
  async getFile(rec, path, asJson) {
    if ((await this.src(rec)) === 'priv') {
      const r = await Family.api(Family.repo() + '/contents/audio/' + path, { raw: true });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      // the iPhone only plays a downloaded file when it's labeled as MP3
      return asJson ? r.json() : URL.createObjectURL(new Blob([await r.arrayBuffer()], { type: 'audio/mpeg' }));
    }
    if (!asJson) return this.base() + path;
    const r = await fetch(this.base() + path); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json();
  },
  async chapter(rec, voice, ch) {
    const k = this.key(rec) + '/' + voice + '/' + String(ch).padStart(3, '0');
    if (!this.maps.has(k)) this.maps.set(k, (async () => { const m = await this.getFile(rec, k + '.json', true); m.url = await this.getFile(rec, k + '.mp3', false); return m; })());
    try { const m = await this.maps.get(k); return { url: m.url, times: m.times || [], dur: m.dur, len: m.len }; }
    catch (e) { this.maps.delete(k); throw e; }
  },
  // the next chapter is fetched while this one plays, so the change is instant (even with the screen locked)
  prefetch(rec, voice, ch) { this.has(rec, 'a:' + voice, ch).then(ok => { if (ok) this.chapter(rec, voice, ch).catch(() => { }); }); if (this.maps.size > 6) { const [k0, p0] = this.maps.entries().next().value; this.maps.delete(k0); p0.then(m => { if (m.url.startsWith('blob:')) URL.revokeObjectURL(m.url); }).catch(() => { }); } },
  // export what the narrator needs: each chapter's sentences exactly as the app shows them
  async exportBook() {
    const out = { title: Book.rec.title, key: this.key(Book.rec), lang: (Book.flow.lang || '').slice(0, 2), chapters: [] };
    for (let i = 0; i < Book.data.count; i++) {
      await Book.render(i, { frac: 0 }); TTS.build();
      out.chapters.push({ i, label: Book.tocLabel ? Book.tocLabel(i) : '', len: (Book.rootText || '').length, segs: TTS.segs.map(s => [s.s, s.e, s.t, s.lang]) });
    }
    return out;
  },
};
</script>
