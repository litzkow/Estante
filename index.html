<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141518">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estante">
<link rel="apple-touch-icon" href="lib/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="lib/icon-180.png">
<title>Estante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Merriweather:ital,opsz,wght@0,18..144,400;0,18..144,500;0,18..144,700;1,18..144,400&display=swap">
<style>
:root{
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --accent:#e8a33d;--accent-ink:#1a1307;--danger:#e5484d;
  --r:14px;
}
.t-claro{--bg:#f6f4ef;--fg:#1f1d1a;--muted:#77716a;--card:#ffffff;--card2:#efebe3;--line:#e2ddd3;--bar:rgba(246,244,239,.94);--shadow:0 6px 20px rgba(40,30,10,.12);--paper:#fbfaf7;--ink:#1d1c1a}
.t-sepia{--bg:#efe3c8;--fg:#43351f;--muted:#80704f;--card:#f7edd8;--card2:#e7d7b5;--line:#d9c7a1;--bar:rgba(239,227,200,.95);--shadow:0 6px 20px rgba(70,50,10,.16);--paper:#f3e7cf;--ink:#4a3b27}
.t-escuro{--bg:#141518;--fg:#ebe7df;--muted:#9a958c;--card:#1f2024;--card2:#2a2b30;--line:#2e2f35;--bar:rgba(20,21,24,.93);--shadow:0 8px 24px rgba(0,0,0,.45);--paper:#1e1f22;--ink:#d9d4cb}
.t-noite{--bg:#000;--fg:#b3ab9e;--muted:#6f685e;--card:#0c0c0c;--card2:#171717;--line:#1d1d1d;--bar:rgba(0,0,0,.94);--shadow:none;--paper:#000;--ink:#9d968a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-user-select:none;user-select:none}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.view{position:fixed;inset:0;display:none}
.view.on{display:block}
.icon{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon:active{background:rgba(127,127,127,.18)}
.icon svg{width:22px;height:22px}
.pill{height:34px;padding:0 12px;border-radius:999px;background:rgba(127,127,127,.16);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.pill svg{width:16px;height:16px}
.btn{height:46px;padding:0 18px;border-radius:12px;background:var(--card2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.muted{color:var(--muted)}
.hide{display:none!important}

/* ---------- library ---------- */
#v-lib{overflow-y:auto;-webkit-overflow-scrolling:touch}
.lib-wrap{max-width:1100px;margin:0 auto;padding:calc(var(--st) + 10px) calc(var(--sr) + 18px) calc(var(--sb) + 110px) calc(var(--sl) + 18px)}
.lib-top{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.brand{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.5px;flex:1;display:flex;align-items:center;gap:10px}
.brand .dot{width:10px;height:10px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
.searchbar{display:none;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 10px;height:44px;margin:6px 0 10px}
.searchbar.on{display:flex}
.searchbar input{flex:1;border:0;background:none;outline:none;font-size:16px;height:100%}
.searchbar svg{width:18px;height:18px;color:var(--muted)}
.hero{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:8px 0 18px;box-shadow:var(--shadow);text-align:left;width:100%}
.hero .hcover{width:78px;flex:none;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--card2)}
.hero .hcover img,.hero .hcover .gen{width:100%;height:100%;object-fit:cover}
.hero .hinfo{flex:1;min-width:0}
.hero .hlabel{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent);font-weight:700;margin-bottom:4px}
.hero .htitle{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .hsub{font-size:13px;color:var(--muted);margin-top:4px}
.hero .hbar{height:4px;border-radius:2px;background:var(--card2);margin-top:10px;overflow:hidden}
.hero .hbar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.hero .hgo{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none}
.hero .hgo svg{width:22px;height:22px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip svg{width:15px;height:15px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.sec-h h2{font-size:15px;font-weight:600;margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:18px 12px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:24px 20px}}
.card{position:relative;min-width:0}
.card .cover{display:block;width:100%;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--card2);box-shadow:var(--shadow);position:relative}
.card .cover img{width:100%;height:100%;object-fit:cover;display:block}
.card .cover .badge{position:absolute;left:6px;top:6px;font-size:10px;font-weight:700;letter-spacing:.6px;padding:3px 6px;border-radius:6px;background:rgba(0,0,0,.62);color:#fff;text-transform:uppercase}
.card .cover .done{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.card .cover .done svg{width:14px;height:14px}
.card .cover .cbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.35)}
.card .cover .cbar i{display:block;height:100%;background:var(--accent)}
.card .crow{display:flex;align-items:flex-start;gap:2px;margin-top:8px}
.card .ctext{flex:1;min-width:0}
.card .ctitle{font-size:13.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cmeta{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .more{width:28px;height:28px;border-radius:8px;margin-top:-4px;margin-right:-6px}
.card .more svg{width:18px;height:18px}
.card.ghost .cover{opacity:.5;border:1.5px dashed var(--line);box-shadow:none}
.gen{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:12% 10%;color:#fff;font-family:var(--serif)}
.gen .gt{font-size:15px;font-weight:600;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.gen .ga{font-family:var(--ui);font-size:10px;opacity:.85;text-transform:uppercase;letter-spacing:1px}
.empty{text-align:center;padding:40px 10px 20px}
.empty .art{width:120px;height:120px;margin:0 auto 18px;color:var(--accent)}
.empty h3{font-family:var(--serif);font-size:22px;margin:0 0 8px}
.empty p{color:var(--muted);line-height:1.5;max-width:420px;margin:0 auto 20px;font-size:15px}
.empty .fmts{font-size:12.5px;color:var(--muted);margin-top:18px}
.banner{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;margin:6px 0 12px;display:flex;gap:10px;align-items:flex-start}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--accent)}
.fab{position:fixed;right:calc(var(--sr) + 20px);bottom:calc(var(--sb) + 22px);height:56px;padding:0 22px 0 18px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 28px rgba(0,0,0,.35);z-index:4}
.fab svg{width:22px;height:22px}
.drop{position:fixed;inset:0;background:rgba(232,163,61,.18);border:3px dashed var(--accent);z-index:60;display:none;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--fg)}
.drop.on{display:flex}

/* ---------- reader chrome ---------- */
.r-top,.r-bot{position:absolute;left:0;right:0;z-index:6;transition:transform .25s ease,opacity .25s ease;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.r-top{top:0;padding:calc(var(--st) + 4px) calc(var(--sr) + 6px) 6px calc(var(--sl) + 6px);display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line)}
.r-bot{bottom:0;padding:10px calc(var(--sr) + 16px) calc(var(--sb) + 10px) calc(var(--sl) + 16px);border-top:1px solid var(--line)}
.r-title{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.reader.ui-off .r-top{transform:translateY(-105%);opacity:0;pointer-events:none}
.reader.ui-off .r-bot{transform:translateY(105%);opacity:0;pointer-events:none}
.r-bot .row{display:flex;align-items:center;gap:12px}
.r-bot .lbl{font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;flex:1}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--card2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);margin-top:-8px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--card2)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:0}
.dark-chrome{--bar:rgba(14,14,16,.9);--line:#26262b;--fg:#eee;--muted:#9a9a9a;--card2:#3a3a40;color:#eee}

/* ---------- comic ---------- */
#v-comic{background:#000}
#c-stage{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#000;-webkit-user-select:none;user-select:none}
#c-zoom{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0}
#c-cam{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#c-cam img{display:block;-webkit-user-drag:none;pointer-events:none;max-width:none}
#c-spot{position:absolute;left:0;top:0;pointer-events:none;border-radius:2px;box-shadow:0 0 0 300vmax rgba(0,0,0,0)}
#c-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.c-steps{display:flex;gap:4px;justify-content:center;margin-top:8px;min-height:6px;flex-wrap:wrap}
.c-steps i{width:6px;height:6px;border-radius:3px;background:var(--card2);transition:all .2s}
.c-steps i.on{background:var(--accent);width:16px}
.hint{position:absolute;inset:0;z-index:7;display:flex;pointer-events:none;animation:fade .3s}
.hint div{flex:1;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:#fff;background:rgba(232,163,61,.16);border-right:1px dashed rgba(255,255,255,.35);text-align:center;padding:10px;text-shadow:0 1px 3px #000}
.hint div:nth-child(2){flex:1.3;background:rgba(255,255,255,.07)}
.hint div:last-child{border-right:0}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.thumbs button{position:relative;border-radius:6px;overflow:hidden;background:var(--card2);aspect-ratio:2/3}
.thumbs button img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button span{position:absolute;bottom:0;left:0;right:0;font-size:11px;padding:3px;background:rgba(0,0,0,.6);color:#fff;text-align:center}
.thumbs button.cur{outline:3px solid var(--accent);outline-offset:-3px}
.thumbs button .bm{position:absolute;top:0;right:6px;width:14px;height:20px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}

/* ---------- book ---------- */
#v-book{background:var(--paper);color:var(--ink)}
#b-frame{position:absolute;overflow:hidden;touch-action:pan-y;left:var(--sl);right:var(--sr);top:calc(var(--st) + 38px);bottom:calc(var(--sb) + 38px)}
#b-flow{position:absolute;top:0;left:0;height:100%;column-fill:auto;will-change:transform;font-family:var(--bk-font);font-size:var(--bk-size);line-height:var(--bk-lh);overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto;color:var(--ink);text-rendering:optimizeLegibility}
#b-flow.just{text-align:justify}
#b-flow .chap>*:first-child{margin-top:0}
#b-flow p{margin:0 0 var(--bk-ps)}
#b-flow.indent p{margin:0;text-indent:1.5em}
#b-flow.indent p:first-child,#b-flow.indent h1+p,#b-flow.indent h2+p,#b-flow.indent h3+p{text-indent:0}
#b-flow h1,#b-flow h2,#b-flow h3,#b-flow h4,#b-flow h5,#b-flow h6{line-height:1.25;margin:1.1em 0 .6em;break-after:avoid;text-align:left;font-weight:700;-webkit-hyphens:manual;hyphens:manual}
#b-flow h1{font-size:1.5em}#b-flow h2{font-size:1.3em}#b-flow h3{font-size:1.12em}
#b-flow img,#b-flow svg{max-width:100%;max-height:calc(var(--bk-h) - 1.5em);height:auto;width:auto;display:block;margin:.6em auto;break-inside:avoid;object-fit:contain}
#b-flow figure{margin:.8em 0;break-inside:avoid}
#b-flow blockquote{margin:.8em 0 .8em 1.2em;padding-left:.8em;border-left:3px solid var(--line)}
#b-flow pre,#b-flow code{white-space:pre-wrap;font-size:.88em}
#b-flow table{max-width:100%;border-collapse:collapse;font-size:.9em}
#b-flow td,#b-flow th{border:1px solid var(--line);padding:.2em .4em}
#b-flow hr{border:0;border-top:1px solid var(--line);margin:1.2em 20%}
#b-flow a{color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:2px}
#b-flow sup,#b-flow sub{line-height:0}
#b-flow mark{color:inherit;border-radius:2px;padding:0 .5px}
#b-flow mark.hl-y{background:rgba(255,214,64,.45)}
#b-flow mark.hl-g{background:rgba(120,210,120,.4)}
#b-flow mark.hl-b{background:rgba(110,170,255,.38)}
#b-flow mark.hl-p{background:rgba(255,130,180,.38)}
#b-flow mark.hl-note{border-bottom:2px dotted var(--accent)}
#b-flow mark.find{background:var(--accent);color:#000;transition:background 1s}
body.t-noite #b-flow img{opacity:.8}
.b-meta{position:absolute;left:calc(var(--sl) + 20px);right:calc(var(--sr) + 20px);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:14px;pointer-events:none;font-family:var(--ui);font-variant-numeric:tabular-nums}
.b-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#b-head{top:calc(var(--st) + 12px)}
#b-foot{bottom:calc(var(--sb) + 12px)}
#b-bm{position:absolute;top:var(--st);right:calc(var(--sr) + 18px);width:18px;height:28px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);display:none;z-index:2}
#b-bm.on{display:block}
#selbar{position:fixed;z-index:40;display:none;background:#202126;color:#fff;border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.45);gap:2px;align-items:center}
#selbar.on{display:flex}
#selbar button{height:38px;min-width:38px;padding:0 9px;border-radius:10px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px}
#selbar button:active{background:rgba(255,255,255,.14)}
#selbar button svg{width:17px;height:17px}
#selbar .sw{width:22px;height:22px;min-width:22px;padding:0;border-radius:50%;margin:0 3px;border:2px solid rgba(255,255,255,.7)}
#selbar .sep{width:1px;height:22px;background:rgba(255,255,255,.2);margin:0 3px}

/* ---------- pdf ---------- */
#v-pdf{background:#2b2c30}
body.t-claro #v-pdf,body.t-sepia #v-pdf{background:#d8d4cc}
#p-scroll{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
#p-pages{margin:0 auto;padding:calc(var(--st) + 60px) 0 calc(var(--sb) + 80px)}
.pp{position:relative;margin:0 auto 10px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.pp canvas{position:absolute;inset:0;width:100%;height:100%}
.pp .pn{position:absolute;left:50%;bottom:-2px;transform:translate(-50%,100%);font-size:11px;color:var(--muted);padding-top:2px}
body.t-noite .pp canvas,body.t-escuro .pp.inv canvas{filter:invert(1) hue-rotate(180deg)}
body.t-sepia .pp canvas{filter:sepia(.35)}

/* ---------- sheets ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.backdrop.center{align-items:center;padding:20px}
.sheet{width:100%;max-width:600px;max-height:88vh;display:flex;flex-direction:column;background:var(--card);color:var(--fg);border-radius:20px 20px 0 0;animation:up .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.backdrop.center .sheet{border-radius:20px;max-width:440px;animation:pop .2s}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet .sh-head{display:flex;align-items:center;gap:8px;padding:10px 12px 6px 20px;flex:none}
.sheet .sh-head h3{flex:1;margin:0;font-size:18px;font-weight:700}
.sheet .sh-body{overflow-y:auto;padding:6px 20px calc(var(--sb) + 22px);-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pop{from{transform:scale(.94);opacity:0}}
@keyframes fade{from{opacity:0}}
.grp{margin:14px 0 4px}
.grp>.gl{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:8px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px;white-space:nowrap}
.seg button svg{width:18px;height:18px;flex:none}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.themes{display:flex;gap:10px}
.themes button{flex:1;height:56px;border-radius:12px;border:2px solid transparent;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.themes button b{font-family:var(--serif);font-size:18px}
.themes button.on{border-color:var(--accent)}
.row-t{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row-t:last-child{border-bottom:0}
.row-t .tx{flex:1}
.row-t .tx b{display:block;font-weight:600;font-size:15px}
.row-t .tx small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.35}
.sw-t{width:50px;height:30px;border-radius:15px;background:var(--card2);position:relative;flex:none;transition:background .2s}
.sw-t::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw-t.on{background:var(--accent)}
.sw-t.on::after{transform:translateX(20px)}
.sl{display:flex;align-items:center;gap:10px}
.sl svg{width:18px;height:18px;color:var(--muted);flex:none}
.sl output{width:38px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;background:var(--card2);border-radius:12px;height:46px}
.stepper button{width:64px;height:100%;font-weight:700}
.stepper .v{flex:1;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fonts button{height:48px;border-radius:12px;background:var(--card2);font-size:16px;border:2px solid transparent}
.fonts button.on{border-color:var(--accent)}
.list button.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid var(--line);font-size:15px}
.list button.li:last-child{border-bottom:0}
.list button.li svg{width:20px;height:20px;flex:none;color:var(--muted)}
.list button.li .lt{flex:1;min-width:0}
.list button.li .lt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list button.li.cur{color:var(--accent);font-weight:600}
.list button.li.danger{color:var(--danger)}
.list button.li.danger svg{color:var(--danger)}
.list .empty-l{color:var(--muted);text-align:center;padding:24px 10px;font-size:14px;line-height:1.5}
.field{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px;outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{height:110px;padding:12px 14px;resize:none;line-height:1.4}
.ai-out{font-family:var(--serif);font-size:17px;line-height:1.6;white-space:pre-wrap}
.ai-out.ui{font-family:var(--ui);font-size:15px}
.ai-think{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:10px 0}
.ai-think .spin{width:20px;height:20px;border-width:2px}
.tr-item{padding:12px 0;border-bottom:1px solid var(--line)}
.tr-item:last-child{border-bottom:0}
.tr-item .o{font-size:13px;color:var(--muted);margin-bottom:4px;font-style:italic}
.tr-item .t{font-size:17px;line-height:1.45;font-family:var(--serif)}
.tr-item .w{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--accent);font-weight:700;margin-bottom:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;margin:6px 0 16px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.res{display:block;width:100%;text-align:left;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}
.res small{display:block;color:var(--accent);font-size:11.5px;font-weight:600;margin-bottom:2px}
.res mark{background:rgba(232,163,61,.35);color:inherit;border-radius:2px}
.hl-row{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.hl-row .bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.hl-row .bx{flex:1;min-width:0;text-align:left}
.hl-row .bx q{font-family:var(--serif);font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;quotes:none}
.hl-row .bx .nt{font-size:13px;color:var(--muted);margin-top:4px}
.hl-row .bx small{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
.tabs2{display:flex;gap:4px;margin:0 0 10px}

/* ---------- misc overlays ---------- */
#warm,#dim{position:fixed;inset:0;pointer-events:none;z-index:90;opacity:0;transition:opacity .3s}
#warm{background:#ff9a3c;mix-blend-mode:multiply}
#dim{background:#000}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 96px);transform:translateX(-50%) translateY(20px);background:#25262b;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 40px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4);line-height:1.35}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#busy{position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff;font-weight:600;font-size:15px}
#busy.on{display:flex}
.pause-card{background:var(--card);border-radius:22px;padding:26px 22px;text-align:center;max-width:360px;width:100%;animation:pop .25s}
.pause-card .eye{width:64px;height:64px;margin:0 auto 12px;color:var(--accent)}
.pause-card h3{margin:0 0 8px;font-size:20px}
.pause-card p{color:var(--muted);line-height:1.5;margin:0 0 18px;font-size:15px}
.pause-card .count{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:16px;color:var(--accent)}

body.no-ai #p-ai{display:none!important}
#b-flow p:has(br),#b-flow .poem p,#b-flow .stanza,#b-flow .poetry,#b-flow .poetry0,#b-flow .poetry2,#b-flow .verse{text-align:left!important;-webkit-hyphens:manual;hyphens:manual;text-indent:0}

/* ================= design pass ================= */
/* splash */
#splash{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% 70%,#3a2a1a 0,#1c1a28 45%,#0e0e12 100%);transition:opacity .5s ease,transform .5s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp-in{display:flex;flex-direction:column;align-items:center}
#splash .logo{width:132px;height:132px;overflow:visible}
.lb{transform-box:fill-box;transform-origin:50% 100%;animation:bookUp .7s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(.15s + var(--d)*.09s)}
.lb.lean{transform-origin:0 100%;animation-name:bookLean}
.lg-shelf{transform-box:fill-box;transform-origin:50% 50%;animation:shelfIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes bookUp{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
@keyframes bookLean{0%{transform:scaleY(0);opacity:0}60%{transform:rotate(-17deg);opacity:1}80%{transform:rotate(3deg)}100%{transform:none}}
@keyframes shelfIn{from{transform:scaleX(0)}to{transform:none}}
.sp-name{font-family:var(--serif);font-size:40px;font-weight:600;color:#f6ecd6;letter-spacing:-.5px;margin-top:14px;animation:riseIn .6s .6s cubic-bezier(.2,.8,.2,1) both}
.sp-tag{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#e8a33d;animation:riseIn .6s .78s cubic-bezier(.2,.8,.2,1) both}
.sp-tag i{width:4px;height:4px;border-radius:1px;background:#e8a33d;transform:rotate(45deg)}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* views fade in */
.view.on{animation:fadeIn .28s ease}

/* library header */
.brand{font-size:32px}
.greet{color:var(--muted);font-size:14px;margin:-4px 0 12px 2px}
.today{width:100%;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:0 0 12px;text-align:left}
.tring{position:relative;width:56px;height:56px;flex:none}
.tring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .rt{stroke:var(--card2)}
.ring .rv{stroke:var(--accent);animation:ringFill 1.1s .2s cubic-bezier(.2,.8,.2,1) forwards}
.ring.full .rv{stroke:#4cc38a}
@keyframes ringFill{to{stroke-dashoffset:var(--to)}}
.tinfo{flex:1;min-width:0}
.tinfo .tl{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent);font-weight:700}
.tinfo .tv{font-size:15px;font-weight:600;margin-top:3px}
.streak{display:flex;align-items:center;gap:4px;height:34px;padding:0 12px;border-radius:999px;background:var(--card2);color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.streak svg{width:17px;height:17px}
.streak.on{background:rgba(232,104,61,.16);color:#f07a3d}
.gstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.gstats div{background:var(--card2);border-radius:14px;padding:12px 14px}
.gstats b{display:block;font-size:26px;font-weight:700}
.gstats span{font-size:12.5px;color:var(--muted)}
.week{display:flex;gap:8px;height:120px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.wd span{font-size:12px;color:var(--muted)}
.wb{position:relative;flex:1;width:100%;max-width:30px;background:var(--card2);border-radius:8px;overflow:hidden;display:flex;align-items:flex-end}
.wb i{display:block;width:100%;background:var(--accent);border-radius:8px;opacity:.75}
.wd.met .wb i{background:#4cc38a;opacity:1}
.wb hr{position:absolute;left:0;right:0;margin:0;border:0;border-top:1.5px dashed var(--muted);opacity:.6}
.goalseg{display:grid!important;grid-template-columns:repeat(4,1fr)}

/* hero */
.hero{position:relative;overflow:hidden;padding:16px;gap:18px;border-radius:22px}
.hero .hbg{position:absolute;inset:-30px;filter:blur(34px) saturate(1.4);opacity:.38;z-index:0;pointer-events:none}
.hero .hbg img,.hero .hbg .gen{width:100%;height:100%;object-fit:cover}
.hero>*:not(.hbg){position:relative;z-index:1}
.hero .hcover{width:96px;border-radius:4px 8px 8px 4px;box-shadow:0 10px 26px rgba(0,0,0,.4)}
.hero .htitle{font-size:21px}
.hero .hpct{font-size:12px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.hero .hgo{width:52px;height:52px;box-shadow:0 6px 18px rgba(232,163,61,.45)}
.hero:active{transform:scale(.985)}
.hero{transition:transform .15s}

/* covers: book-like depth */
.card .cover{border-radius:3px 8px 8px 3px;transition:transform .18s ease,box-shadow .18s ease;box-shadow:0 1px 2px rgba(0,0,0,.2),0 8px 18px -6px rgba(0,0,0,.45)}
.card .cover::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(90deg,rgba(0,0,0,.32) 0,rgba(255,255,255,.22) 2.5%,rgba(0,0,0,.14) 4.5%,rgba(0,0,0,0) 9%,rgba(0,0,0,0) 94%,rgba(255,255,255,.10) 100%),linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,0) 30%)}
.card .cover:active{transform:perspective(700px) rotateY(-9deg) scale(.96)}
@media (hover:hover){.card .cover:hover{transform:translateY(-4px);box-shadow:0 2px 4px rgba(0,0,0,.2),0 16px 28px -8px rgba(0,0,0,.5)}}
.grid.anim .card{animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*40ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.fab{transition:transform .15s}
.fab:active{transform:scale(.94)}

/* opening transition */
.openfx{position:fixed;z-index:84;overflow:hidden;pointer-events:none}
.openfx>img,.openfx>.gen{width:100%;height:100%;object-fit:cover}

/* tour */
.tour{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .3s}
.tour.out{opacity:0;transition:opacity .3s}
.tw-card{width:100%;max-width:400px;background:var(--bg);border:1px solid var(--line);border-radius:28px;padding:26px 22px 20px;box-shadow:0 30px 80px rgba(0,0,0,.5);text-align:center;touch-action:pan-y}
.tw-card.in .tw-art,.tw-card.in .tw-txt{animation:riseIn .45s cubic-bezier(.2,.8,.2,1) both}
.tw-card.in .tw-txt{animation-delay:.06s}
.tw-art{height:170px;display:flex;align-items:center;justify-content:center;background:radial-gradient(70% 70% at 50% 60%,rgba(232,163,61,.18),transparent 70%);border-radius:20px;margin-bottom:18px}
.tw-art svg{height:150px;width:auto;max-width:100%;overflow:visible}
.tw-art .logo{height:130px}
.tw-txt h2{font-family:var(--serif);font-size:24px;margin:0 0 8px;letter-spacing:-.3px}
.tw-txt p{color:var(--muted);line-height:1.5;font-size:15px;margin:0;min-height:68px}
.tw-dots{display:flex;gap:6px;justify-content:center;margin:18px 0}
.tw-dots i{width:7px;height:7px;border-radius:4px;background:var(--card2);transition:all .25s}
.tw-dots i.on{width:22px;background:var(--accent)}
.tw-btns{display:flex;gap:10px}
.tw-btns .btn{flex:1}
.btn.ghost{background:transparent;color:var(--muted)}
.tw-pop{transform-box:fill-box;transform-origin:center;animation:pop 1.6s .3s ease-in-out infinite}
.tw-files rect,.tw-files text{animation:floaty 2.4s ease-in-out infinite}
.tw-focus{animation:pulse 1.4s ease-in-out infinite}
.tw-hl{transform-box:fill-box;transform-origin:0 50%;animation:hl 1.8s .2s ease-out both}
.tw-bar{animation:riseIn .5s 1s both}
.tw-knob{animation:knob 2.6s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes hl{from{transform:scaleX(0)}to{transform:none}}
@keyframes knob{0%,100%{transform:translateX(0)}50%{transform:translateX(-60px)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
.banner.dl{align-items:center}
.banner.dl .dlt{flex:1;min-width:0}
.banner.dl .dlm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.banner.dl .hbar{height:4px;border-radius:2px;background:var(--card);margin-top:6px;overflow:hidden}
.banner.dl .hbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}

/* ================= reader polish (Apple Books / Kindle as reference) ================= */
html[data-view=v-book],html[data-view=v-book] body{background:var(--paper)}
html[data-view=v-comic],html[data-view=v-comic] body{background:#000}
#b-frame{touch-action:none}
#b-flow{text-rendering:optimizeLegibility;font-kerning:normal;-webkit-font-smoothing:antialiased;font-feature-settings:"kern","liga","onum"}
#b-flow p{orphans:2;widows:2}
#b-flow h1,#b-flow h2,#b-flow h3{text-align:center;font-weight:600;letter-spacing:-.01em;margin:1.4em 0 1.1em}
#b-flow h1{font-size:1.45em}#b-flow h2{font-size:1.3em}#b-flow h3{font-size:1.1em}
#b-flow .chap>h1:first-child,#b-flow .chap>h2:first-child,#b-flow .chap>section:first-child>h2:first-child,#b-flow .chap>section:first-child>header:first-child{margin-top:1.6em}
#b-flow hgroup,#b-flow header{text-align:center;margin-bottom:1.2em}
#b-flow hgroup p,#b-flow header p{text-indent:0;font-style:italic;color:var(--muted)}
#b-flow.opener .chap{padding-top:calc(var(--bk-h) * .3);text-align:center}
#b-flow.opener h1,#b-flow.opener h2,#b-flow.opener h3{font-size:1.7em;margin:0 0 .5em}
#b-flow.opener p{text-indent:0;color:var(--muted)}
.b-meta{font-size:12px;letter-spacing:.1px}
#b-head{left:calc(var(--sl) + 56px);right:calc(var(--sr) + 56px);justify-content:center;text-align:center}
#b-h2:empty{display:none}
#b-foot{justify-content:space-between}
.b-x{position:absolute;z-index:5;top:calc(var(--st) + 2px);left:calc(var(--sl) + 8px);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:.75}
.b-x svg{width:18px;height:18px}
.b-x:active{background:rgba(127,127,127,.18)}
#v-book:not(.ui-off) .b-x{opacity:0;pointer-events:none}
#b-lang{margin-right:2px}
.pt-ghost{background:var(--paper);pointer-events:none;will-change:transform}
#b-frame{background:var(--paper)}
.seg.wrap{display:grid!important;grid-template-columns:repeat(3,1fr);gap:4px}
.seg.wrap button{white-space:normal;line-height:1.15;min-height:40px}
#b-flow blockquote{border-left:0;padding-left:0;margin:.8em 0}
/* faixa da barra de status: o conteúdo rola por baixo sem ficar embaixo do relógio */
#v-lib::before{content:'';position:fixed;left:0;right:0;top:0;height:var(--st);background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:5}
.card .cover img{object-position:center}
.today,.hero{position:relative;cursor:pointer}
.cardx{position:absolute;top:6px;right:6px;z-index:3;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--card2);opacity:.85}
.cardx svg{width:14px;height:14px}
.cardx:active{transform:scale(.9)}
.today .streak{margin-right:22px}
.hero .hgo{margin-right:10px}
.hero>.cardx{position:absolute;top:8px;right:8px;z-index:3}
/* pastas de série */
.card .cover.fstack{background:none;box-shadow:none;overflow:visible;border-radius:0}
.card .cover.fstack::after{display:none}
.fstack .fs{position:absolute;inset:0;border-radius:3px 8px 8px 3px;overflow:hidden;background:var(--card2);box-shadow:0 1px 2px rgba(0,0,0,.2),0 8px 18px -6px rgba(0,0,0,.45);transform:translate(calc(var(--k)*6px),calc(var(--k)*-6px)) rotate(calc(var(--k)*2.5deg));transform-origin:50% 100%;transition:transform .25s}
.fstack .fs img,.fstack .fs .gen{width:100%;height:100%;object-fit:cover}
.fstack:active .fs{transform:translate(calc(var(--k)*9px),calc(var(--k)*-9px)) rotate(calc(var(--k)*4deg))}
.fcount{position:absolute;right:6px;bottom:6px;z-index:2;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff}
.fcount svg{width:12px;height:12px}
.card.folder{margin-top:6px}
.fhead{display:flex;flex-direction:column;justify-content:center;margin-left:6px;line-height:1.15}
.fhead b{font-family:var(--serif);font-size:19px}
.fhead span{font-size:12px;color:var(--muted)}
/* ouvir o livro */
::highlight(tts){background-color:rgba(232,163,61,.32);color:inherit}
#tts-bar{position:absolute;z-index:7;left:50%;bottom:calc(var(--sb) + 36px);transform:translate(-50%,140%);opacity:0;pointer-events:none;width:min(420px,calc(100% - 24px));background:var(--bar);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:8px 10px 10px;box-shadow:0 14px 40px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s;color:var(--fg)}
#v-book.tts-on #tts-bar{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#v-book.tts-on:not(.ui-off) #tts-bar{bottom:calc(var(--sb) + 96px)}
.tvoice{display:block;margin:0 auto 4px;font-size:12px;color:var(--muted);max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 8px}
.trow{display:flex;align-items:center;justify-content:space-between}
.tplay{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(232,163,61,.4)}
.tplay svg{width:26px;height:26px}
.trate{min-width:52px;height:34px;border-radius:999px;background:rgba(127,127,127,.16);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
#ttsdark{position:fixed;inset:0;z-index:120;background:#000;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--sb) + 40px)}
#ttsdark .tdh{color:#3a3a3a;font-size:13px;animation:fadeIn 1s}
/* margens no estilo Apple Books: mais respiro em cima e embaixo */

let toastT;
function toast(msg, ms = 2600) {

const Sheets = {
  stack: [],

  rec.pos = cloud.pos || rec.pos; rec.pct = cloud.pct || 0; rec.finished = !!cloud.finished;

}

const byTag = (doc, name) => [...doc.getElementsByTagNameNS('*', name)];
function parseXML(s) { return new DOMParser().parseFromString(s, 'application/xml'); }
function zipFile(zip, path) {
  let f = zip.file(path);

  const low = path.toLowerCase();
  const k = Object.keys(zip.files).find(n => n.toLowerCase() === low);
  return k ? zip.file(k) : null;
}
async function parseEpub(zip) {
  const cont = zipFile(zip, 'META-INF/container.xml');
  if (!cont) throw new Error(t('errEpub'));
  const enc = zipFile(zip, 'META-INF/encryption.xml');
  if (enc) {
    const ex = parseXML(await enc.async('string'));
    const drm = byTag(ex, 'EncryptedData').some(ed => {
      const alg = byTag(ed, 'EncryptionMethod')[0]?.getAttribute('Algorithm') || '';
      const uri = byTag(ed, 'CipherReference')[0]?.getAttribute('URI') || '';
      const fontObf = /idpf\.org\/2008\/embedding|ns\.adobe\.com\/pdf\/enc#RC/.test(alg);
      return !fontObf && !/\.(otf|ttf|woff2?)$/i.test(uri);
    });
    if (drm) throw new Error(t('errDrm'));
  }
  const opfPath = parseXML(await cont.async('string')).getElementsByTagNameNS('*', 'rootfile')[0]?.getAttribute('full-path');
  const opfF = opfPath && zipFile(zip, opfPath);
  if (!opfF) throw new Error(t('errEpub'));
  const opf = parseXML(await opfF.async('string'));
  const base = dirname(opfPath);
  const manifest = {};
  for (const it of byTag(opf, 'item')) {
    const id = it.getAttribute('id'); if (!id) continue;
    manifest[id] = { id, href: resolvePath(base, it.getAttribute('href')), type: it.getAttribute('media-type') || '', props: it.getAttribute('properties') || '' };
  }
  const spineEl = byTag(opf, 'spine')[0];
  const spine = [];
  for (const ir of byTag(opf, 'itemref')) {
    const m = manifest[ir.getAttribute('idref')];
    if (m && /x?html|xml/.test(m.type || 'html')) {
      const f = zipFile(zip, m.href);
      const size = (f && f._data && f._data.uncompressedSize) || 4000;
      spine.push({ href: m.href, size: Math.max(400, size), linear: ir.getAttribute('linear') !== 'no' });
    }
  }
  if (!spine.length) throw new Error(t('errEpub'));
  const txt = n => (byTag(opf, n)[0]?.textContent || '').trim();
  const title = txt('title'), author = txt('creator'), lang = txt('language');
  // cover
  let coverHref = null;
  const ci = Object.values(manifest).find(m => /cover-image/.test(m.props));
  if (ci) coverHref = ci.href;
  if (!coverHref) {
    const meta = byTag(opf, 'meta').find(m => m.getAttribute('name') === 'cover');
    const m = meta && manifest[meta.getAttribute('content')];
    if (m && /image/.test(m.type)) coverHref = m.href;
  }
  if (!coverHref) { const m = Object.values(manifest).find(m => /image/.test(m.type) && /cover/i.test(m.id + m.href)); if (m) coverHref = m.href; }
  // toc
  const toc = [];
  const hrefIdx = (href) => {
    const [p, frag] = href.split('#');
    const i = spine.findIndex(s => s.href === p || s.href.toLowerCase() === p.toLowerCase());
    return { idx: i, frag: frag ? decodeURIComponent(frag) : '' };
  };
  try {
    const nav = Object.values(manifest).find(m => /\bnav\b/.test(m.props));
    if (nav) {
      const nd = new DOMParser().parseFromString(await zipFile(zip, nav.href).async('string'), 'application/xhtml+xml');
      const navs = byTag(nd, 'nav');
      const tn = navs.find(n => /toc/.test(n.getAttribute('epub:type') || n.getAttributeNS('http://www.idpf.org/2007/ops', 'type') || '')) || navs[0];
      const walk = (ol, depth) => {
        for (const li of [...ol.children].filter(c => c.localName === 'li')) {
          const a = [...li.children].find(c => c.localName === 'a' || c.localName === 'span');
          if (a) {
            const href = a.getAttribute('href');
            const label = a.textContent.replace(/\s+/g, ' ').trim();
            if (href && label) { const r = hrefIdx(resolvePath(dirname(nav.href), href) + (href.includes('#') ? '#' + href.split('#')[1] : '')); if (r.idx >= 0) toc.push({ label, depth, ...r }); }
          }
          const sub = [...li.children].find(c => c.localName === 'ol');
          if (sub) walk(sub, depth + 1);
        }
      };
      const ol = tn && [...tn.getElementsByTagNameNS('*', 'ol')][0];
      if (ol) walk(ol, 0);
    }
    if (!toc.length) {
      const tocId = spineEl && spineEl.getAttribute('toc');
      const ncx = (tocId && manifest[tocId]) || Object.values(manifest).find(m => /ncx/.test(m.type));
      if (ncx) {
        const nd = parseXML(await zipFile(zip, ncx.href).async('string'));
        for (const np of byTag(nd, 'navPoint')) {
          let depth = 0, p = np.parentNode; while (p && p.localName === 'navPoint') { depth++; p = p.parentNode; }
          const label = (byTag(np, 'text')[0]?.textContent || '').replace(/\s+/g, ' ').trim();
          const src = byTag(np, 'content')[0]?.getAttribute('src');
          if (label && src) { const r = hrefIdx(resolvePath(dirname(ncx.href), src) + (src.includes('#') ? '#' + src.split('#')[1] : '')); if (r.idx >= 0) toc.push({ label, depth, ...r }); }
        }
      }
    }
  } catch (e) { console.warn('toc', e); }
  let start = -1;
  try {
    const nav = Object.values(manifest).find(m => /\bnav\b/.test(m.props));
    if (nav) {
      const nd = new DOMParser().parseFromString(await zipFile(zip, nav.href).async('string'), 'application/xhtml+xml');
      for (const a of byTag(nd, 'a')) {
        const ty = a.getAttribute('epub:type') || a.getAttributeNS('http://www.idpf.org/2007/ops', 'type') || '';
        if (/bodymatter/.test(ty)) { const h = a.getAttribute('href'); start = hrefIdx(resolvePath(dirname(nav.href), h.split('#')[0])).idx; break; }
      }
    }
    if (start < 0) { const r = byTag(opf, 'reference').find(r => /^(text|start)$/i.test(r.getAttribute('type') || '')); if (r) start = hrefIdx(resolvePath(dirname(opfPath), r.getAttribute('href').split('#')[0])).idx; }
  } catch (e) { }
  if (start < 0) {
    const FRONT = /^(cover|capa|title ?page|half ?title|imprint|copyright|cr[eé]ditos|dedica|epigra|contents|table of contents|sum[aá]rio|[ií]ndice|preface|pref[aá]cio|introduc|introdu[cç]|foreword|translator|tradu|note|nota|colophon|frontispiece|illustrations|list of|pr[oó]logo do tradutor)/i;
    const e = toc.find(e => e.idx > 0 && !FRONT.test(e.label) && e.label.trim().toLowerCase() !== title.trim().toLowerCase());
    if (e) start = e.idx;
  }
  return { title, author, lang, spine, toc, coverHref, start: Math.max(0, start) };
}

function sanitizeInto(root) {
  root.querySelectorAll('script,style,link,meta,title,iframe,object,embed,form,input,button,textarea,select,audio,video,noscript,base,head').forEach(n => n.remove());
  for (const n of root.querySelectorAll('*')) {
    for (const a of [...n.attributes]) {
      const nm = a.name.toLowerCase();
      if (nm.startsWith('on') || nm === 'style' || nm === 'srcset' || nm === 'bgcolor' || nm === 'color' || nm === 'face' || nm === 'size' && n.localName === 'font') n.removeAttribute(a.name);
    }
    if (n.localName === 'font') n.removeAttribute('size');
  }
}

class EpubBook {
  constructor(zip, meta) { this.zip = zip; Object.assign(this, meta); this.urls = new Map(); this.plain = new Map(); }
  static async open(blob) { const zip = await JSZip.loadAsync(blob); return new EpubBook(zip, await parseEpub(zip)); }
  get count() { return this.spine.length; }
  async res(path) {
    if (this.urls.has(path)) return this.urls.get(path);
    const f = zipFile(this.zip, path); if (!f) return '';
    const b = await f.async('blob');
    const u = URL.createObjectURL(new Blob([b], { type: mimeOf(path) }));
    this.urls.set(path, u); return u;
  }
  async parseDoc(i) {
    const it = this.spine[i]; const f = zipFile(this.zip, it.href);
    const src = f ? await f.async('string') : '<p>—</p>';
    let doc = new DOMParser().parseFromString(src, 'application/xhtml+xml');
    if (doc.getElementsByTagName('parsererror').length || !(doc.body || byTag(doc, 'body')[0])) doc = new DOMParser().parseFromString(src, 'text/html');
    const body = doc.body || byTag(doc, 'body')[0] || doc.documentElement;
    // move src away before the nodes enter the live document (or the browser would fetch them)
    for (const im of byTag(body, 'img')) { const v = im.getAttribute('src'); if (v != null) { im.setAttribute('data-src', v); im.removeAttribute('src'); } im.removeAttribute('srcset'); }
    for (const so of byTag(body, 'source')) so.remove();
    const wrap = document.createElement('div'); wrap.className = 'chap';
    for (const n of [...body.childNodes]) wrap.appendChild(document.importNode(n, true));
    sanitizeInto(wrap);
    return wrap;
  }
  async chapter(i) {
    const wrap = await this.parseDoc(i), base = dirname(this.spine[i].href);
    const jobs = [];
    for (const img of wrap.querySelectorAll('img')) {
      const s = img.getAttribute('data-src'); img.removeAttribute('data-src');
      if (s && !/^(https?:|data:)/i.test(s)) jobs.push(this.res(resolvePath(base, s)).then(u => { img.src = u; }));
      else if (s && /^data:/i.test(s)) img.src = s;
    }
    for (const im of wrap.querySelectorAll('image')) {
      const s = im.getAttribute('xlink:href') || im.getAttributeNS('http://www.w3.org/1999/xlink', 'href') || im.getAttribute('href');
      if (s) jobs.push(this.res(resolvePath(base, s)).then(u => { im.setAttribute('href', u); try { im.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', u); } catch (e) { } }));
    }
    for (const a of wrap.querySelectorAll('a[href]')) {
      const h = a.getAttribute('href');
      if (/^[a-z][a-z0-9+.-]*:/i.test(h)) { a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener noreferrer'); }

    }
    await Promise.all(jobs);
    return wrap;
  }
  async text(i) {
    if (this.plain.has(i)) return this.plain.get(i);
    const w = await this.parseDoc(i); const s = w.textContent;
    this.plain.set(i, s); return s;
  }
  locate(href) {
    const [p, frag] = href.split('#');
    const idx = this.spine.findIndex(s => s.href === p || s.href.toLowerCase() === (p || '').toLowerCase());
    return { idx, frag: frag ? decodeURIComponent(frag) : '' };
  }
  close() { for (const u of this.urls.values()) URL.revokeObjectURL(u); this.urls.clear(); }
}

function decodeText(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder('windows-1252').decode(buf); }
}
class TxtBook {
  constructor(text, title) {
    text = text.replace(/\r\n?/g, '\n').replace(/﻿/g, '');
    let paras = text.split(/\n\s*\n/);
    if (paras.length < text.length / 3000) paras = text.split(/\n/);
    paras = paras.map(p => p.replace(/\s*\n\s*/g, ' ').trim()).filter(Boolean);
    const isHead = p => p.length < 90 && (/^(cap[ií]tulo|chapter|parte|part|livro|book|pr[oó]logo|prologue|ep[ií]logo|epilogue)\b/i.test(p) || /^[IVXLC]+\.?$/.test(p));
    this.spine = []; this.toc = []; this.title = title; this.author = ''; this.lang = '';
    let cur = [], len = 0, head = null;
    const flush = () => { if (!cur.length) return; this.spine.push({ paras: cur, size: Math.max(400, len), head }); if (head) this.toc.push({ label: head, depth: 0, idx: this.spine.length - 1, frag: '' }); cur = []; len = 0; head = null; };
    for (const p of paras) {
      if (isHead(p) && cur.length) flush();
      if (isHead(p) && !cur.length) head = p;
      if (len > 30000 && !isHead(p)) flush();
      cur.push(p); len += p.length;
    }
    flush();
    if (!this.spine.length) this.spine.push({ paras: [''], size: 400 });
    if (!this.toc.length) this.spine.forEach((s, i) => this.toc.push({ label: t('part') + ' ' + (i + 1), depth: 0, idx: i, frag: '' }));
  }
  get count() { return this.spine.length; }
  async chapter(i) {
    const w = document.createElement('div'); w.className = 'chap';
    for (const p of this.spine[i].paras) w.append(p === this.spine[i].head ? el('h2', { text: p }) : el('p', { text: p }));
    return w;
  }
  async parseDoc(i) { return this.chapter(i); }
  async text(i) { return (await this.chapter(i)).textContent; }
  locate() { return { idx: -1 }; }
  close() { }
}

async function sniff(file) {
  const b = new Uint8Array(await file.slice(0, 8).arrayBuffer());
  const s = String.fromCharCode(...b);
  if (s.startsWith('PK')) return 'zip';
  if (s.startsWith('%PDF')) return 'pdf';
  if (s.startsWith('Rar!')) return 'rar';
  if (s.startsWith('7z')) return '7z';
  if (/\.(mobi|azw3?|kfx|prc)$/i.test(file.name) || s.slice(0, 8) === 'BOOKMOBI') return 'kindle';
  if (/\.(txt|text|md)$/i.test(file.name) || /^text\//.test(file.type)) return 'txt';
  if (/^image\//.test(file.type) || IMG_RE.test(file.name)) return 'image';
  return 'unknown';
}
function genCoverColor(title) { const h = hueOf(title); return `linear-gradient(160deg,hsl(${h},45%,38%),hsl(${(h + 40) % 360},50%,22%))`; }

async function addRecord(rec, blob) {
  rec.fp = await fingerprint(blob);
  // already in library?
  const all = await DB.all('books');
  const dup = all.find(b => b.fp === rec.fp);
  if (dup) { toast(t('alreadyHave', { t: dup.title })); return dup; }
  const okFile = await DB.put('files', rec.id, blob);
  if (!okFile) Lib.memOnly = true;
  rec.size = blob.size; rec.added = Date.now(); rec.opened = 0; rec.updated = 0;
  rec.pct = 0; rec.pos = null; rec.bookmarks = []; rec.highlights = []; rec.collections = rec.collections || [];
  // resume from cloud if this file exists elsewhere
  const cloud = await Sync.pull(rec.fp);
  if (cloud) { mergeCloud(rec, cloud); if (cloud.title && cloud.title !== rec.title && rec.titleGuess) rec.title = cloud.title; }
  await DB.put('books', rec.id, rec);
  return rec;
}

async function importComicZip(blob, name, zip) {
  zip = zip || await JSZip.loadAsync(blob);
  const imgs = zipImages(zip);
  if (!imgs.length) throw new Error(t('errNoImages', { f: name }));
  const first = await zip.file(imgs[0]).async('blob');
  let cover = null;
  try { const u = URL.createObjectURL(new Blob([first], { type: mimeOf(imgs[0]) })); const im = await loadImg(u); cover = await thumbFrom(im, im.naturalWidth, im.naturalHeight); URL.revokeObjectURL(u); } catch (e) { }
  let title = cleanTitle(name.split('/').pop()), author = '';
  let series = '', snum = 0;
  const ci = Object.keys(zip.files).find(n => /comicinfo\.xml$/i.test(n));
  if (ci) { try { const x = parseXML(await zip.file(ci).async('string')); const g = n => (byTag(x, n)[0]?.textContent || '').trim(); const s = g('Series'), num = g('Number'), tt = g('Title'); if (s) { series = s; snum = +num || 0; } if (s) title = s + (num ? ' #' + num : '') + (tt && tt !== s ? ' — ' + tt : ''); else if (tt) title = tt; author = g('Writer'); } catch (e) { } }
  return addRecord({ id: uid(), kind: 'comic', format: 'cbz', title, author, fname: name, cover, pages: imgs.length, prefs: {}, titleGuess: true, series: series || undefined, snum }, blob);
}
async function importImages(files) {
  files.sort((a, b) => natCmp(a.name, b.name));
  const zip = new JSZip();
  files.forEach((f, i) => zip.file(String(i + 1).padStart(4, '0') + '_' + f.name.replace(/[\/\\]/g, '_'), f));
  const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE', mimeType: 'application/vnd.comicbook+zip' });
  let name = files[0].name.replace(/[\s_\-]*\d+\.[a-z0-9]+$/i, '').replace(/\.[a-z0-9]+$/i, '');
  if (!name || name.length < 2) name = t('imagesTitle') + ' ' + new Date().toLocaleDateString();
  return importComicZip(blob, name + '.cbz', zip);
}
// cover thumbnail; SVG covers (Standard Ebooks) get an explicit size, or fall back to the picture inside them (iPhone needs this)
async function epubCover(zip, href) {
  const tryBlob = async (blob, w0, h0) => { const u = URL.createObjectURL(blob); try { const im = await loadImg(u); const w = im.naturalWidth || w0, h = im.naturalHeight || h0; if (!w || !h) throw 0; return await thumbFrom(im, w, h); } finally { URL.revokeObjectURL(u); } };
  try {
    const f = zipFile(zip, href); if (!f) return null;
    if (/\.svg$/i.test(href)) {
      let s = await f.async('string');
      const vb = (s.match(/viewBox="[\d.\s-]*?([\d.]+)\s+([\d.]+)"/) || []).slice(1).map(Number);
      const W = vb[0] || 1400, H = vb[1] || 2100;
      if (!/<svg[^>]*\swidth=/.test(s)) s = s.replace(/<svg\b/, `<svg width="${W}" height="${H}"`);
      try { return await tryBlob(new Blob([s], { type: 'image/svg+xml' }), W, H); } catch (e) { }
      const m = s.match(/href="data:(image\/[a-z+]+);base64,([^"]+)"/);
      if (m) { const bin = atob(m[2]), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return await tryBlob(new Blob([a], { type: m[1] }), W, H); }
      return null;
    }
    return await tryBlob(new Blob([await f.async('blob')], { type: mimeOf(href) }));
  } catch (e) { return null; }
}
// one-time repair of covers that came out blank on the phone
async function fixCovers() {
  if (S.coverFix >= 2) return;
  for (const b of await DB.all('books')) {
    if (b.format !== 'epub') continue;
    try {
      const blob = await DB.get('files', b.id); if (!blob) continue;
      const zip = await JSZip.loadAsync(blob); const meta = await parseEpub(zip);
      if (!meta.coverHref || !/\.svg$/i.test(meta.coverHref)) continue;
      const c = await epubCover(zip, meta.coverHref); if (c) { b.cover = c; await DB.put('books', b.id, b); }
    } catch (e) { }
  }
  setS('coverFix', 2); Lib.render();
}
async function importEpub(file, zip) {
  const meta = await parseEpub(zip);

  return addRecord({ id: uid(), kind: 'book', format: 'epub', title: meta.title || cleanTitle(file.name), author: meta.author, lang: meta.lang, fname: file.name, cover, chapters: meta.spine.length, prefs: {} }, file);
}
async function importPdf(file) {
  const pdf = await openPdf(file);
  let cover = null, kind = 'comic';
  try { const cv = await renderPdfPage(pdf, 1, 360); cover = await canvasBlob(cv, 'image/jpeg', 0.82); } catch (e) { }
  try {
    // look at pages spread through the whole file (the first ones are often cover and pictures)
    const N = pdf.numPages, picks = [...new Set(Array.from({ length: Math.min(N, 8) }, (_, k) => Math.max(1, Math.min(N, Math.round(1 + (N - 1) * (0.1 + 0.8 * k / Math.max(1, Math.min(N, 8) - 1)))))))];
    const per = [];
    for (const i of picks) { const tc = await (await pdf.getPage(i)).getTextContent(); per.push(tc.items.reduce((s, it) => s + (it.str || '').length, 0)); }
    per.sort((a, b) => a - b);
    if ((per[per.length >> 1] || 0) > 350) kind = 'book';
  } catch (e) { }
  let title = cleanTitle(file.name), author = '';
  try { const md = await pdf.getMetadata(); const inf = md && md.info || {}; if (inf.Title && inf.Title.trim().length > 2 && !/^untitled|microsoft word|^\(?anonymous/i.test(inf.Title)) title = inf.Title.trim(); author = (inf.Author || '').trim(); if (/^\(?(anonymous|unknown)\)?$/i.test(author)) author = ''; } catch (e) { }
  const pages = pdf.numPages; closePdf(pdf);
  return addRecord({ id: uid(), kind, format: 'pdf', title, author, fname: file.name, cover, pages, prefs: {} }, file);
}
async function importTxt(file) {
  const text = decodeText(await file.arrayBuffer());
  return addRecord({ id: uid(), kind: 'book', format: 'txt', title: cleanTitle(file.name), author: '', fname: file.name, cover: null, prefs: {} }, new Blob([text], { type: 'text/plain' }));
}
async function importFiles(list) {
  const files = [...list]; if (!files.length) return;
  const kinds = await Promise.all(files.map(sniff));
  const images = files.filter((f, i) => kinds[i] === 'image');
  const others = files.map((f, i) => [f, kinds[i]]).filter(([, k]) => k !== 'image');
  let added = 0, last = null;
  const errs = [];
  busy(t('adding'));
  try {
    if (images.length) { try { last = await importImages(images); added++; } catch (e) { errs.push(e.message); } }
    let n = 0;
    for (const [f, k] of others) {
      n++; busy(t('adding') + (others.length > 1 ? ` (${n}/${others.length})` : ''));
      try {
        if (k === 'zip') {
          const zip = await JSZip.loadAsync(f);
          if (zipFile(zip, 'META-INF/container.xml')) last = await importEpub(f, zip);
          else last = await importComicZip(f, f.name, zip);
        } else if (k === 'pdf') last = await importPdf(f);
        else if (k === 'txt') last = await importTxt(f);
        else if (k === 'rar' || k === '7z') throw new Error(t('errRar', { f: f.name }));
        else if (k === 'kindle') throw new Error(t('errKindle', { f: f.name }));
        else throw new Error(t('errUnknown', { f: f.name }));
        added++;
      } catch (e) { console.warn(e); errs.push(e && e.message ? e.message : t('errUnknown', { f: f.name })); }
    }
  } finally { busy(null); }
  await Lib.render();
  if (errs.length) Sheets.open({ title: t('someFailed'), center: true, body: b => { for (const m of errs) b.append(el('p', { style: { lineHeight: 1.5 }, text: m })); b.append(el('button', { class: 'btn primary block', text: 'OK', onclick: () => Sheets.close() })); } });
  else if (added === 1 && last) toast(t('addedOne', { t: last.title }));

  const N = w * h, ink = new Uint8Array(N);

  const RP = new Int32Array((w + 1) * h), CP = new Int32Array((h + 1) * w);
  for (let y = 0; y < h; y++) { let s = 0; const o = y * (w + 1), r = y * w; for (let x = 0; x < w; x++) { s += ink[r + x]; RP[o + x + 1] = s; } }
  for (let x = 0; x < w; x++) { let s = 0; const o = x * (h + 1); for (let y = 0; y < h; y++) { s += ink[y * w + x]; CP[o + y + 1] = s; } }
  const rowInk = (y, x0, x1) => RP[y * (w + 1) + x1] - RP[y * (w + 1) + x0];
  const colInk = (x, y0, y1) => CP[x * (h + 1) + y1] - CP[x * (h + 1) + y0];
  const minGap = Math.max(2, Math.round(Math.min(w, h) * 0.0035));
  const leaves = [];
  const trim = r => {
    let { x0, y0, x1, y1 } = r;
    const tw = Math.floor((x1 - x0) * 0.002), th = Math.floor((y1 - y0) * 0.002);
    while (y0 < y1 && rowInk(y0, x0, x1) <= tw) y0++;
    while (y1 > y0 && rowInk(y1 - 1, x0, x1) <= tw) y1--;
    while (x0 < x1 && colInk(x0, y0, y1) <= th) x0++;
    while (x1 > x0 && colInk(x1 - 1, y0, y1) <= th) x1--;
    return { x0, y0, x1, y1 };
  };
  // strict: (almost) no ink across the whole line.
  // relaxed: some ink allowed (a balloon crossing the gutter) but both ends of the line must be clear,
  // which a line inside a bordered panel never is.
  const gaps = (r, horiz, relaxed) => {
    const { x0, y0, x1, y1 } = r, len = horiz ? x1 - x0 : y1 - y0;
    const tol = relaxed ? Math.floor(len * 0.3) : Math.floor(len * 0.002);
    const e = Math.max(2, Math.round(len * 0.02)), need = relaxed ? Math.round(minGap * 1.5) : minGap;
    const a = horiz ? y0 : x0, b = horiz ? y1 : x1, cuts = []; let run = -1;
    for (let p = a; p <= b; p++) {
      let ok = false;
      if (p < b) {
        const v = horiz ? rowInk(p, x0, x1) : colInk(p, y0, y1);
        ok = v <= tol;
        if (ok && relaxed) ok = horiz ? (rowInk(p, x0, x0 + e) === 0 && rowInk(p, x1 - e, x1) === 0) : (colInk(p, y0, y0 + e) === 0 && colInk(p, y1 - e, y1) === 0);
      }
      if (ok) { if (run < 0) run = p; }
      else { if (run >= 0 && p - run >= need && run > a && p < b) cuts.push([run, p]); run = -1; }
    }
    return cuts;
  };
  const rec = (r, depth) => {
    r = trim(r);
    const rw = r.x1 - r.x0, rh = r.y1 - r.y0;
    if (rw < w * 0.03 || rh < h * 0.02) return;
    const big = rw * rh > w * h * 0.1;
    if (depth < 12) for (const [horiz, relaxed] of [[true, false], [false, false], [true, true], [false, true]]) {
      if (relaxed && !big) break;
      const cuts = gaps(r, horiz, relaxed); if (!cuts.length) continue;
      const segs = []; let s = horiz ? r.y0 : r.x0;
      for (const [g0, g1] of cuts) { segs.push([s, g0]); s = g1; }
      segs.push([s, horiz ? r.y1 : r.x1]);
      if (!horiz && dir === 'rtl') segs.reverse();
      for (const [a, b] of segs) rec(horiz ? { x0: r.x0, x1: r.x1, y0: a, y1: b } : { x0: a, x1: b, y0: r.y0, y1: r.y1 }, depth + 1);
      return;
    }
    leaves.push(r);
  };
  rec({ x0: 0, y0: 0, x1: w, y1: h }, 0);
  const area = w * h;
  let ps = leaves.filter(r => (r.x1 - r.x0) * (r.y1 - r.y0) >= area * 0.008);
  if (ps.length > 26 || !ps.length) return [];
  const white = r => { let ink = 0; for (let y = r.y0; y < r.y1; y += 2) ink += rowInk(y, r.x0, r.x1); return 100 - ink * 2 / Math.max(1, (r.x1 - r.x0) * (r.y1 - r.y0)) * 100; };
  const uni = (a, b) => ({ x0: Math.min(a.x0, b.x0), y0: Math.min(a.y0, b.y0), x1: Math.max(a.x1, b.x1), y1: Math.max(a.y1, b.y1) });
  const dist = (a, b) => Math.hypot(Math.max(0, a.x0 - b.x1, b.x0 - a.x1), Math.max(0, a.y0 - b.y1, b.y0 - a.y1));
  // logo / title / caption strips (mostly page colour, short): they belong with the nearest panel, never on their own
  for (let guard = 0; guard < 6 && ps.length > 1; guard++) {
    const k = ps.findIndex(r => (r.y1 - r.y0) < h * 0.22 && white(r) > 40);
    if (k < 0) break;
    const s = ps[k]; ps.splice(k, 1);
    let bi = 0, bd = Infinity; ps.forEach((r, i) => { const d = dist(r, s); if (d < bd) { bd = d; bi = i; } });
    ps[bi] = uni(ps[bi], s);
  }
  // balloons that spill out of a panel into the gutter: their text is ink outside every panel.
  // group that ink and give it to the nearest panel, so a balloon is never cut or shown empty
  {
    const G = Math.max(4, Math.round(Math.min(w, h) / 140)), gw = Math.ceil(w / G), gh = Math.ceil(h / G);
    const inside = (x, y) => ps.some(r => x >= r.x0 - 2 && x < r.x1 + 2 && y >= r.y0 - 2 && y < r.y1 + 2);
    const cell = new Uint8Array(gw * gh);
    for (let cy = 0; cy < gh; cy++) for (let cx = 0; cx < gw; cx++) {
      let n = 0;
      for (let y = cy * G; y < Math.min(h, cy * G + G); y++) for (let x = cx * G; x < Math.min(w, cx * G + G); x++) if (ink[y * w + x] && !inside(x, y)) n++;
      if (n >= 2) cell[cy * gw + cx] = 1;
    }
    const seen = new Uint8Array(gw * gh), R = 2;
    for (let i = 0; i < gw * gh; i++) {
      if (!cell[i] || seen[i]) continue;
      const st = [i]; seen[i] = 1; let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1, cnt = 0;
      while (st.length) {
        const c = st.pop(), cx = c % gw, cy = (c / gw) | 0; cnt++;
        x0 = Math.min(x0, cx); y0 = Math.min(y0, cy); x1 = Math.max(x1, cx); y1 = Math.max(y1, cy);
        for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
          const nx = cx + dx, ny = cy + dy; if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue;
          const j = ny * gw + nx; if (cell[j] && !seen[j]) { seen[j] = 1; st.push(j); }
        }
      }
      if (cnt < 3) continue;
      const pad = G * 2, blob = { x0: Math.max(0, x0 * G - pad), y0: Math.max(0, y0 * G - pad), x1: Math.min(w, (x1 + 1) * G + pad), y1: Math.min(h, (y1 + 1) * G + pad) };
      let bi = -1, bd = Infinity; ps.forEach((r, k) => { const d = dist(r, blob); if (d < bd) { bd = d; bi = k; } });
      if (bi >= 0 && bd < Math.min(w, h) * 0.12) ps[bi] = uni(ps[bi], blob);
    }
  }
  if (ps.length === 1 && (ps[0].x1 - ps[0].x0) * (ps[0].y1 - ps[0].y0) > area * 0.55) return [];
  // title / logo pages: the gaps between big letters look like gutters -> show the whole page
  const small = ps.filter(r => (r.x1 - r.x0) * (r.y1 - r.y0) < area * 0.04);
  if (small.length >= 3 && small.length >= ps.length / 2) return [];
  // panels must cover most of the page; otherwise it is an illustration, not a grid
  const cover = ps.reduce((a, r) => a + (r.x1 - r.x0) * (r.y1 - r.y0), 0);
  if (cover < area * 0.35) return [];
  const px = w * 0.006, py = h * 0.006, BINS = 48;
  // whiteness profile across each panel: balloons are page-coloured, art is not.
  // a wide panel is only ever split where the line runs through art (never through a balloon)
  const prof = (r, horiz) => {
    const out = [], L = horiz ? r.x1 - r.x0 : r.y1 - r.y0, M = horiz ? r.y1 - r.y0 : r.x1 - r.x0;
    for (let b = 0; b < BINS; b++) {
      const a = Math.floor(b * L / BINS), e = Math.max(a + 1, Math.floor((b + 1) * L / BINS)); let ink = 0, tot = 0;
      for (let p = a; p < e; p++) { const v = horiz ? colInk(r.x0 + p, r.y0, r.y1) : rowInk(r.y0 + p, r.x0, r.x1); ink += v; tot += M; }

    }

  };
  return ps.map(r => {
    const x0 = Math.max(0, r.x0 - px), y0 = Math.max(0, r.y0 - py), x1 = Math.min(w, r.x1 + px), y1 = Math.min(h, r.y1 + py);
    return { x: x0 / w, y: y0 / h, w: (x1 - x0) / w, h: (y1 - y0) / h, cx: prof(r, true), cy: prof(r, false) };
  });
}

/* split very wide / very tall panels so text stays big on the screen */
function splitPanel(p, sa, dir) {
  if (!S.cSplit) return [p];
  const r = (p.w / p.h) / sa, ov = 0.12;
  const mk = (n, horiz) => {
    const prof = horiz ? p.cx : p.cy;
    // older cached pages have no profile: keep the whole panel rather than risk cutting a balloon
    if (!prof || !prof.length) return [p];
    const B = prof.length, cuts = [];
    for (let k = 1; k < n; k++) {
      const ideal = k / n * B, win = Math.round(B * 0.2);
      let best = -1, bs = Infinity;
      for (let b = Math.max(1, Math.round(ideal - win)); b <= Math.min(B - 2, Math.round(ideal + win)); b++) {
        const sc = (prof[b - 1] + prof[b] * 2 + prof[b + 1]) / 4 + Math.abs(b - ideal) * 0.8;
        if (sc < bs) { bs = sc; best = b; }
      }
      // the best line still crosses a lot of white (a balloon): do not split at all
      if (best < 0 || (prof[best - 1] + prof[best] * 2 + prof[best + 1]) / 4 > 40) return [p];
      cuts.push((best + 0.5) / B);
    }
    const L = horiz ? p.w : p.h, o = L * 0.05, out = [], edges = [0, ...cuts, 1];
    for (let k = 0; k < edges.length - 1; k++) {
      const a = Math.max(0, edges[k] * L - (k ? o : 0)), b = Math.min(L, edges[k + 1] * L + (k < edges.length - 2 ? o : 0));
      out.push(horiz ? { x: p.x + a, y: p.y, w: b - a, h: p.h } : { x: p.x, y: p.y + a, w: p.w, h: b - a });
    }
    if (horiz && dir === 'rtl') out.reverse();
    void ov; return out;
  };
  if (r > 2.3) return mk(Math.min(3, Math.max(2, Math.round(Math.sqrt(r)))), true);
  if (1 / r > 2.3) return mk(Math.min(3, Math.max(2, Math.round(Math.sqrt(1 / r)))), false);
  return [p];
}

/* ================= comic source ================= */
async function comicSource(rec, blob) {
  if (rec.format === 'pdf') {
    const pdf = await openPdf(blob);
    const tw = () => Math.round(Math.min(2400, Math.max(1500, Math.max(innerWidth, innerHeight) * (devicePixelRatio || 1) * 1.1)));
    return {
      count: pdf.numPages,
      async page(i) { const cv = await renderPdfPage(pdf, i + 1, tw(), 4600); const b = await canvasBlob(cv, 'image/jpeg', 0.9); const url = URL.createObjectURL(b); const img = await loadImg(url); return { url, img, w: img.naturalWidth, h: img.naturalHeight }; },
      async thumb(i) { const cv = await renderPdfPage(pdf, i + 1, 200); return canvasBlob(cv, 'image/jpeg', 0.75); },
      close() { try { closePdf(pdf); } catch (e) { } },
    };
  }
  const zip = await JSZip.loadAsync(blob);
  const names = zipImages(zip);
  if (!names.length) throw new Error(t('errNoImages', { f: rec.title }));
  const pageBlob = async i => new Blob([await zip.file(names[i]).async('blob')], { type: mimeOf(names[i]) });
  return {
    count: names.length,
    async page(i) { const url = URL.createObjectURL(await pageBlob(i)); const img = await loadImg(url); return { url, img, w: img.naturalWidth, h: img.naturalHeight }; },
    async thumb(i) { const url = URL.createObjectURL(await pageBlob(i)); try { const im = await loadImg(url); return await thumbFrom(im, im.naturalWidth, im.naturalHeight, 200); } finally { URL.revokeObjectURL(url); } },
    close() { },
  };
}

/* ================= comic reader ================= */
const Comic = {
  rec: null, src: null, cache: new Map(), page: 0, step: 0, steps: [], cur: null, token: 0,
  z: { s: 1, x: 0, y: 0 }, zb: null, uiT: null,
  get mode() { return (this.rec && this.rec.prefs.mode) || S.cMode; },
  get dir() { return (this.rec && this.rec.prefs.dir) || S.cDir; },
  init() {
    this.stage = $('#c-stage'); this.zoomer = $('#c-zoom'); this.cam = $('#c-cam'); this.spot = $('#c-spot');
    gestures(this.stage, {
      tap: (x, y) => {
        const W = this.stage.clientWidth, zone = x / W, now = performance.now();
        // double tap on a panel while seeing the whole page: guided reading starts at that panel (like Comixology)
        if (this.lastTap && now - this.lastTap.t < 320 && Math.hypot(x - this.lastTap.x, y - this.lastTap.y) < 40) {
          clearTimeout(this.tapT); this.lastTap = null;
          if ((S.cDbl || 'zoom') === 'zoom') return this.dblZoom(x, y);
          this.enterPanelAt(x, y); return;
        }
        this.lastTap = { t: now, x, y };
        const act = () => {
          if (zone > 0.3 && zone < 0.7) return this.toggleUI();
          const fwd = zone >= 0.7;
          (this.dir === 'rtl' ? !fwd : fwd) ? this.next() : this.prev();
        };
        const r = this.steps[this.step];
        // wait a moment so a second tap can become a double tap (zoom)
        if ((S.cDbl || 'zoom') === 'zoom' || (r && r.full && this.mode === 'quadros' && this.steps.length > 1)) { clearTimeout(this.tapT); this.tapT = setTimeout(act, 260); } else act();
      },
      swipe: d => { if (this.z.s > 1.05) return; const fwd = d === 'left'; (this.dir === 'rtl' ? !fwd : fwd) ? this.next() : this.prev(); },
      down: () => { this.zb = Object.assign({}, this.z); },
      pan: (dx, dy) => { if (this.z.s <= 1.02) return; this.z.x = this.zb.x + dx; this.z.y = this.zb.y + dy; this.applyZoom(false); },
      panEnd: () => this.z.s > 1.02,
      pinchStart: () => { this.zb = Object.assign({}, this.z); },
      pinchMove: (k, c, c0) => {
        const s = clamp(this.zb.s * k, 1, 6), f = s / this.zb.s;
        this.z.s = s; this.z.x = c.x - (c0.x - this.zb.x) * f; this.z.y = c.y - (c0.y - this.zb.y) * f; this.applyZoom(false);
      },
      pinchEnd: () => { if (this.z.s < 1.06) this.resetZoom(true); },
    });
    $('#c-mode').onclick = () => this.cycleMode();
    $('#c-set').onclick = () => this.settings();
    $('#c-grid').onclick = () => this.pagesSheet();
    $('#c-tr').onclick = () => this.toggleTr();
    $('#c-tr').classList.toggle('hide', !AI.fn);
    $('#c-bmk').onclick = () => this.toggleBookmark();
    const rg = $('#c-range');
    rg.oninput = () => { $('#c-label').textContent = t('pageXofY', { a: rg.value, b: this.src.count }); };
    rg.onchange = () => this.goto(+rg.value - 1, 0);
    $('#v-comic .r-back').onclick = () => this.close();
  },
  async open(rec, blob) {
    this.rec = rec; rec.prefs = rec.prefs || {};
    busy(t('opening'));
    try { this.src = await comicSource(rec, blob); } finally { busy(null); }
    this.cache.clear(); this.cur = null; this.cam.replaceChildren();
    $('#c-title').textContent = rec.title;
    const rg = $('#c-range'); rg.max = this.src.count; rg.min = 1;
    App.show('v-comic');
    this.showUI(true);
    Resume.apply(rec);
    const pos = rec.pos || {};
    await this.goto(clamp(pos.page || 0, 0, this.src.count - 1), pos.step || 0, false);
    if (!(await DB.get('kv', 'hint:comic'))) { DB.put('kv', 'hint:comic', 1); this.hint(); }
  },
  hint() {
    const back = t('hintBack'), fwd = t('hintNext');
    const h = el('div', { class: 'hint' }, el('div', { text: this.dir === 'rtl' ? fwd : back }), el('div', { text: t('hintMenu') }), el('div', { text: this.dir === 'rtl' ? back : fwd }));
    $('#v-comic').append(h); setTimeout(() => h.remove(), 3200);
  },
  size() { return { SW: this.stage.clientWidth || innerWidth, SH: this.stage.clientHeight || innerHeight }; },
  key(i) { return 'pn:' + this.rec.id + ':' + i + ':' + this.dir + ':v2'; },
  load(i) {
    if (this.cache.has(i)) return this.cache.get(i);
    const p = (async () => {
      const pg = await this.src.page(i);
      let panels = await DB.get('kv', this.key(i));
      if (!Array.isArray(panels)) { panels = detectPanels(pg.img, pg.w, pg.h, this.dir); DB.put('kv', this.key(i), panels); }
      pg.i = i; pg.panels = panels; return pg;
    })();

    this.cache.set(i, p); return p;
  },
  evict(center) {
    for (const [k, p] of this.cache) if (Math.abs(k - center) > 3) { this.cache.delete(k); p.then(pg => { if (this.cur !== pg) URL.revokeObjectURL(pg.url); }).catch(() => { }); }
  },
  computeSteps(pg) {
    const W = pg.w, H = pg.h, { SW, SH } = this.size(), full = { x: 0, y: 0, w: W, h: H, full: true };
    const m = this.mode;

    }

  },
  async goto(i, step, animate = true) {

    let pg;
    try { pg = await this.load(i); }
    catch (e) { clearTimeout(ld); $('#c-load').classList.add('hide'); toast(t('pageFail')); return; }
    clearTimeout(ld); $('#c-load').classList.add('hide');
    if (tok !== this.token) return;
    const changed = this.cur !== pg;
    this.cur = pg; this.page = i;
    if (changed) {
      pg.img.style.width = pg.w + 'px'; pg.img.style.height = pg.h + 'px';
      pg.img.style.opacity = '0'; pg.img.style.transition = 'opacity .18s';

  },
  rectFor(r) {
    const { SW, SH } = this.size();
    const pad = r.full || r.strip ? 0 : Math.min(14, SW * 0.03);
    const s = Math.min((SW - 2 * pad) / r.w, (SH - 2 * pad) / r.h);
    return { s, tx: (SW - r.w * s) / 2 - r.x * s, ty: (SH - r.h * s) / 2 - r.y * s, sx: (SW - r.w * s) / 2, sy: (SH - r.h * s) / 2, sw: r.w * s, sh: r.h * s };
  },
  apply(animate) {
    const r = this.steps[this.step]; if (!r) return;
    const q = this.rectFor(r);
    const tr = animate && S.anim ? 'transform .42s cubic-bezier(.25,.8,.25,1)' : 'none';
    const trs = animate && S.anim ? 'all .42s cubic-bezier(.25,.8,.25,1)' : 'none';
    this.cam.style.transition = tr; this.spot.style.transition = trs;
    this.cam.style.transform = `translate(${q.tx}px,${q.ty}px) scale(${q.s})`;
    Object.assign(this.spot.style, { left: q.sx + 'px', top: q.sy + 'px', width: q.sw + 'px', height: q.sh + 'px', boxShadow: `0 0 0 300vmax rgba(0,0,0,${(!r.full && !r.strip) ? ({ off: 0, dim: 0.78, black: 1 }[S.cBox || (S.cSpot ? 'dim' : 'off')]) : 0})` });

  },
  enterPanelAt(x, y) {
    const r = this.steps[this.step]; if (!r) return;

    const px = (x - st.left - q.tx) / q.s, py = (y - st.top - q.ty) / q.s;
    const k = this.steps.findIndex(s => !s.full && px >= s.x && px <= s.x + s.w && py >= s.y && py <= s.y + s.h);

  },
  // ---------- translated balloons (AI reads the page, finds each balloon and translates it) ----------
  trLang() { return (this.rec.prefs.trTo) || (S.lang === 'en' ? 'en' : 'pt'); },
  async toggleTr() {
    if (!AI.fn) return;
    const on = !this.rec.prefs.tr;

  const ramp = (x, a, b) => Math.min(1, Math.max(0, (x - a) / (b - a)));

  const late = h >= 12 ? ramp(h, 21, 23) : 1 - ramp(h, 4.5, 6);
  return { warm: Math.round(night * 45), dim: Math.round(late * 18) };
}

    const img = from.querySelector('img, .gen'); if (img) box.append(img.cloneNode(true));

    const W = innerWidth, H = innerHeight;
    const a = box.animate([
      { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', borderRadius: '8px' },
      { left: '0px', top: '0px', width: W + 'px', height: H + 'px', borderRadius: '0px' }], { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' });
    if (box.firstChild) box.firstChild.animate([{ opacity: 1 }, { opacity: 1, offset: .45 }, { opacity: 0 }], { duration: 420, fill: 'forwards' });
    return { box, done: a.finished };
  },
  async end(fx) {
    if (!fx) return;
    await fx.done.catch(() => { });
